# Infraestrutura do NutriPlan no Render, declarada em arquivo.
#
# Com este arquivo na raiz do repositório, o Render cria o serviço web e o
# banco sozinho ("Blueprint"): não é preciso clicar em nada além de conectar o
# repositório. O que estiver aqui é a verdade — mudar pelo painel e esquecer de
# refletir no arquivo é como o ambiente vira algo que ninguém sabe reproduzir.
#
# Depois de subir, os comandos de manutenção rodam no Shell do serviço:
#   python manage.py createsuperuser
#   python manage.py check_exercise_videos

databases:
  - name: nutriplan-db
    databaseName: nutriplan
    user: nutriplan
    plan: free
    # PRAZO REAL, lido no painel em 31/08/2026: este banco EXPIRA EM
    # 23/09/2026, e o texto do Render e "will be deleted unless you upgrade" —
    # apagado, nao suspenso. Nao existe backup gerenciado no plano gratuito,
    # entao o que nao tiver sido despejado ate la nao volta.
    #
    # Tamanho nunca foi o problema: o banco restaurado ocupa 12 MB, e o painel
    # marca 7,18% de 1 GB. O problema e o relogio.
    #
    # `scripts/backup.sh` tira o dump e `scripts/restaurar.sh` prova que ele
    # volta. Rode o primeiro ANTES de mexer em qualquer coisa aqui.
services:
  - type: web
    name: nutriplan
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "./scripts/build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --log-file -"
    # Bate em /saude/vivo/, que NÃO consulta o banco.
    #
    # Era /saude/, e o argumento estava certo enquanto durou: aquele endpoint
    # confere o catálogo e falha quando o banco cai ou fica vazio, que são as
    # duas formas de o site subir inútil. A troca não desfaz esse raciocínio —
    # muda a premissa embaixo dele.
    #
    # O Render bate no health check a cada ~5 segundos, medido no log de
    # produção em 01/09/2026 (17:44:07, :11, :16, :21, :26...). Enquanto o banco
    # era o PostgreSQL do próprio Render, mantê-lo acordado não custava nada.
    # Depois da migração para o Neon custa a cota inteira: o plano gratuito dá
    # 100 CU-horas por mês e hiberna após 5 minutos parado. Uma consulta a cada
    # 5 segundos significa 17 mil por dia e hibernação nenhuma — a 0,25 CU
    # contínuo são 180 CU-horas no mês, e a cota acaba por volta do dia 16.
    #
    # O que se perde é o Render reiniciar sozinho quando o BANCO cai. O que se
    # ganha é o banco existir no fim do mês. A verificação profunda continua em
    # /saude/, para monitor externo em intervalo humano — minutos, não segundos.
    healthCheckPath: /saude/vivo/
    envVars:
      # `generateValue: true` ficou aqui por muito tempo, e parecia a escolha
      # certa: chave gerada pela plataforma, nunca vista por ninguém. O detalhe
      # que derruba isso é aritmético — o Render gera 256 bits em base64, o que
      # dá 44 caracteres, e o Django exige 50. Resultado: `security.W009` aceso
      # em produção desde o primeiro deploy, sem nunca travar nada, porque o
      # build roda `check --deploy --fail-level ERROR` e W é warning.
      #
      # `accounts.E005` agora reprova esse caso como ERRO. Então a chave é
      # definida à mão no painel, como as de VAPID e SMTP: `sync: false` diz ao
      # Render "esta variável é gerenciada fora do blueprint, não a toque".
      #
      # Ambiente novo criado a partir deste arquivo sobe SEM a variável, cai no
      # padrão de desenvolvimento e o build falha em `accounts.E004` dizendo
      # exatamente o que fazer. Falhar assim é o objetivo: o modo antigo subia
      # calado com uma chave que assina token de redefinição de senha.
      - key: DJANGO_SECRET_KEY
        sync: false

      # Só durante a troca de chave, e vazia no resto do tempo. O Django aceita
      # assinatura feita pela chave antiga enquanto ela estiver nesta lista, o
      # que evita deslogar todo mundo e invalidar os links de recuperação que
      # já saíram. Tire da lista assim que as sessões antigas expirarem.
      - key: DJANGO_SECRET_KEY_FALLBACKS
        sync: false

      # SMTP de produção (Brevo). Declaradas aqui para que o blueprint não
      # minta sobre o que o serviço precisa — os VALORES continuam só no
      # painel. Sem elas, `accounts.E001`/`E002` derrubam o build antes de o
      # app subir, que é melhor que a recuperação de senha escrever link
      # válido no log.
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      # 2525, e NÃO 587, e esta linha é a cicatriz de um defeito que passou
      # meses invisível: o serviço web gratuito do Render bloqueia saída SMTP
      # nas portas 25, 465 e 587. O envio estourava com TimeoutError no socket
      # depois de 10 segundos — e o Django CAPTURA essa falha em
      # `PasswordResetForm.save()`, devolvendo o mesmo 302 de sempre. A tela
      # continuava dizendo "verifique seu e-mail". Ninguém recebia nada.
      #
      # A Brevo atende na 2525 com STARTTLS normal (TLSv1.3 confirmado no
      # handshake), então não se troca criptografia por funcionamento.
      #
      # Declarada com `value:` e não `sync: false` de propósito: a porta não é
      # segredo, e deixá-la solta no painel é como o problema volta.
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Entrar com o Google. Ausentes, o app só não oferece o botão.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Com DEBUG ligado, qualquer erro devolve uma página com settings,
      # caminhos de arquivo e trechos de código. Em produção, nunca.
      - key: DJANGO_DEBUG
        value: "False"

      # O domínio final entra sozinho: config/settings.py lê
      # RENDER_EXTERNAL_HOSTNAME, que o Render injeta em todo serviço web.
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"

      # O banco saiu do Render e foi para o Neon em 01/09/2026, e esta linha
      # é a parte da migração que quase passou despercebida: o serviço é
      # "Blueprint managed", então `fromDatabase` aqui não é documentação — é
      # uma ORDEM. Na próxima sincronização, o Render sobrescreveria a
      # DATABASE_URL de volta para o banco antigo e a migração se desfaria
      # sozinha, sem erro, sem log, sem ninguém pedir.
      #
      # `sync: false` diz "esta variável é gerenciada fora do blueprint".
      # O valor vive só no painel.
      - key: DATABASE_URL
        sync: false

      # Duas gunicorn workers cabem na memória do plano gratuito. Mais que isso
      # e o processo é morto por falta de memória no primeiro pico.
      - key: WEB_CONCURRENCY
        value: "2"

      - key: PYTHON_VERSION
        value: "3.12.10"

      # Sem chave VAPID o app funciona e apenas não oferece notificação. Para
      # ligar, gere um par (`vapid --gen`) e preencha no painel.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false

  # Os lembretes de refeição ficam DESLIGADOS neste arquivo, e a razão é
  # prosaica: cron job no Render é recurso pago, e um `render.yaml` com
  # qualquer serviço pago faz o painel exigir cartão antes de criar até os
  # serviços gratuitos. Como o app funciona inteiro sem lembrete — quem não
  # tem chave VAPID nem vê o botão —, o padrão é o que sobe sem custo.
  #
  # Para ligar depois: descomente o bloco, faça commit, e o Render sincroniza
  # sozinho. Rodar duas vezes no mesmo minuto é seguro: quem decide se alguém
  # já foi avisado é a constraint no banco, não o agendador.
  #
