{% comment %}
Ilustrações das famílias de receita — uma cena por família, clonada pelo card
de refeição com `<use href="#ilu-familia">`.

Por que um SPRITE e não um `<svg>` por card: a tela desenha várias refeições
na mesma página e a família se repete entre os dias. Repetir os traços faria
as cópias divergirem na primeira vez que alguém ajustasse uma — é o motivo
escrito em `partials/icones.html`, cuja forma este arquivo segue.

Por que um sprite SEPARADO dos ícones: ícone é glifo na grade de 24 com traço
2; isto é cena, em 4:3 e com traço mais fino. Juntos, toda tela com um ícone
carregaria onze cenas que ela não desenha.

`viewBox="0 0 48 36"` (4:3) porque o card reserva uma FAIXA larga, não um
quadrado. Desenhar em 24×24 e esticar deformaria o traço — esticado 2× só na
horizontal, ele fica grosso de um lado e fino do outro; na proporção da faixa
o `<use>` escala sem distorcer.

`stroke-width="1.6"` em CADA `<symbol>`, e não na raiz: o `<use>` clona o
símbolo para dentro do consumidor, e o clone herda do CONSUMIDOR — a raiz
deste arquivo fica onde está. Medido no sprite dos ícones em 16/09/2026: com a
espessura só na raiz, o desenho saía com traço 1, o valor inicial do SVG.

Cor: tudo é `currentColor`. São dois regimes (Ferro escuro, Papel claro) e a
cena herda a cor de quem a consome; cor escrita à mão ficaria certa num e
errada no outro. O único preenchimento de cada cena é uma massa de opacidade
baixa, para o prato ter peso sem virar desenho chapado — e ela é
`fill-opacity`, nunca `opacity`: `opacity` apagaria o contorno junto com a
massa, e o traço é o que define a cena.
{% endcomment %}
