{% load escolhas %}{% comment %}
Um grupo de rádios como cartões escolhíveis, em vez de lista de linhas.

O `<input>` fica DENTRO do `<label>`, então o cartão inteiro é a área de
toque — e continua sendo um rádio de verdade: navega por Tab, muda com as
setas, funciona com leitor de tela e envia com o formulário sem uma linha de
JavaScript. Cartão bonito que só funciona com clique de mouse é regressão
disfarçada de melhoria.

O rádio some da tela (`.choice-card__input`) mas não do documento: continua
recebendo foco, e o foco é desenhado no cartão.

`__frame` existe por um motivo específico. A borda e o brilho do estado
escolhido precisam reagir ao input, e o input é FILHO do label — só `:has()`
alcançaria o pai. Este projeto já perdeu a barra de navegação inteira por
depender de `:has()` num navegador que não o suporta, então a moldura é um
irmão do input: `~` alcança, e funciona em qualquer navegador.
{% endcomment %}
<div class="field">
  <span class="field__label">{{ field.label }}</span>
  {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}

  {% comment %}
    `colunas=2` liga a grade de duas colunas em QUALQUER largura, e com ela o
    cartão vira vertical: ícone em cima, texto embaixo.

    A mudança de eixo não é enfeite. Com ícone à esquerda numa coluna de 155px,
    sobram 78px para o texto — doze caracteres por linha, e "Perder gordura
    mantendo o músculo" vira uma torre de cinco linhas. Empilhado, o texto usa
    os 126px inteiros.

    Sem o parâmetro, tudo segue como antes: uma coluna no celular, duas a
    partir de 30rem. É o certo para os cartões que carregam exemplo longo — a
    divisão de treino, por exemplo, tem "Peito+Tríceps · Costas+Bíceps ·
    Pernas+Ombros" numa pílula, e isso não cabe em 155px sem virar quatro
    linhas.
  {% endcomment %}
  <ul class="choice-cards{% if colunas == 2 %} choice-cards--duas{% endif %}" role="list">
    {% for subwidget in field %}
      {% with d=subwidget.data.value|detalhe %}
        <li>
          <label class="choice-card">
            <input class="choice-card__input" type="{{ subwidget.data.type }}"
                   name="{{ subwidget.data.name }}" value="{{ subwidget.data.value }}"
                   {% if subwidget.data.selected %}checked{% endif %}>
            <span class="choice-card__frame" aria-hidden="true"></span>
            <span class="choice-card__icon" aria-hidden="true">
              {% if d %}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                  <use href="#icone-{{ d.icone }}"></use>
                </svg>
              {% endif %}
            </span>
            <span class="choice-card__text">
              {% comment %}
                Título e selo dividem a linha, e não uma cada.

                Com o selo embaixo, o cartão recomendado ficava 46px mais alto
                que os outros dois — medido: 188 contra 142. Numa lista de
                escolha, altura diferente lê como importância diferente, e a
                recomendação já é dita pelo próprio selo.
              {% endcomment %}
              <span class="choice-card__linha">
                <strong class="choice-card__title">
                  {% if d %}{{ d.titulo }}{% else %}{{ subwidget.choice_label }}{% endif %}
                </strong>
              {% comment %}
                A marcação de recomendado.

                Vive no `detalhe`, junto do ícone e do texto de apoio, e não
                numa lista à parte de "qual é a recomendada": é a MESMA decisão
                de tela, e separar em dois lugares é como uma opção acaba
                recomendada em pt-BR e não em outro idioma, ou recomendada no
                onboarding e não na edição do perfil.

                Fora do `__text` o distintivo brigaria com o checkmark pelo
                canto; dentro dele, empurra a linha de apoio para baixo e as
                duas continuam legíveis.
              {% endcomment %}
                {% if d.recomendado %}
                  <span class="choice-card__selo">{{ d.selo }}</span>
                {% endif %}
              </span>
              {% if d.exemplo %}
                {% comment %}
                  O acoplamento em monoespaçada e com separador de meio: é uma
                  LISTA de pares, e a largura fixa do dígito e do ponto faz os
                  pares alinharem entre cartões empilhados. Em fonte de texto a
                  mesma linha lê como frase, e frase é o que a linha de apoio
                  logo acima já é.
                {% endcomment %}
                <span class="choice-card__exemplo num">{{ d.exemplo }}</span>
              {% endif %}
              {% if d %}<span class="choice-card__hint">{{ d.apoio }}</span>{% endif %}
            </span>
            <span class="choice-card__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </span>
          </label>
        </li>
      {% endwith %}
    {% endfor %}
  </ul>

  {% if field.errors %}
    <ul class="field__errors">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
