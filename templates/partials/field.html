{% comment %}
Renderiza um campo de formulário com rótulo, ajuda e erros.

Rádios e checkboxes viram cartões clicáveis (o input fica DENTRO do <label>,
então a área de toque é o cartão inteiro — essencial no celular). Os demais
campos usam o widget padrão, que já vem com a classe .field-input aplicada
pelo form.
{% endcomment %}
<div class="field">
  {% if field.widget_type == "radioselect" or field.widget_type == "checkboxselectmultiple" %}
    <span class="field__label">{{ field.label }}</span>
    {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}
    {% comment %}
      Duas opções curtas e mutuamente exclusivas viram um segmented control:
      dois botões colados dividindo uma moldura, com o escolhido preenchido.

      Não é só aparência. O rádio nativo põe o estado num círculo de 19px na
      lateral, e o que a pessoa lê é o texto ao lado dele — dois lugares para
      uma informação. No segmented, o estado É o botão: quem está preenchido é
      o escolhido, e isso se vê de relance a um braço de distância.

      Continua sendo rádio de verdade por baixo: navega por Tab, muda com as
      setas, leitor de tela anuncia "opção 1 de 2", e envia sem uma linha de
      JavaScript.
    {% endcomment %}
    <ul class="choice-list{% if field.name == 'sex' %} segmented{% endif %}">
      {% for subwidget in field %}
        <li>
          <label>{{ subwidget.tag }}<span class="segmented__fundo" aria-hidden="true"></span><span class="segmented__texto">{{ subwidget.choice_label }}</span></label>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}
    {% if field.field.widget.attrs.sufixo %}
      {% comment %}
        A unidade fica DENTRO do campo, encostada à direita.

        Fora dele, "cm" precisava de um rótulo próprio — "Altura (cm)" — e a
        pessoa lia a unidade uma vez, ao abrir a tela, longe do momento em que
        digita. Dentro, ela está ao lado do número enquanto o número aparece.

        O `padding-right` do campo abre o espaço; o sufixo não recebe toque
        (`pointer-events: none`), então tocar em cima dele foca o campo, que é
        o que a pessoa quer.
      {% endcomment %}
      <span class="campo-unidade">
        {{ field }}
        <span class="campo-unidade__sufixo num" aria-hidden="true">{{ field.field.widget.attrs.sufixo }}</span>
      </span>
    {% elif field.field.widget.input_type == "password" %}
      {% comment %}
        O olho de mostrar a senha.

        Numa tela de celular, digitar senha forte às cegas é onde a pessoa
        erra e desiste — e "senha incorreta" depois de três tentativas não diz
        se o erro foi de dedo ou de memória.

        O botão fica FORA do campo no HTML e por cima dele no CSS: dentro do
        `<input>` não cabe elemento nenhum, e um `<label>` clicável em volta
        roubaria o toque do campo.
      {% endcomment %}
      <span class="campo-senha">
        {{ field }}
        <button type="button" class="campo-senha__olho" data-ver-senha
                aria-label="Mostrar a senha" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="2.75"/>
            <path class="campo-senha__corte" d="M4 20 20 4"/>
          </svg>
        </button>
      </span>
    {% else %}
      {{ field }}
    {% endif %}
  {% endif %}

  {% if field.errors %}
    <ul class="field__errors">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
