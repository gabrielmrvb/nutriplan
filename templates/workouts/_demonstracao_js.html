{% comment %}
  O SCRIPT DA DEMONSTRAÇÃO — poster e fotos alternadas. Partilhado
  pela execução e pela rota de leitura do exercício: os três blocos viviam no
  script da execução e a rota de leitura precisaria copiá-los. Uma cópia.
{% endcomment %}
<script nonce="{{ csp_nonce }}">
  (function () {
    "use strict";

    /* Fotos alternadas, quando a demonstração são dois quadros. É função
       porque o poster é remontado ao fechar o player, e um relógio antigo
       apontaria para uma imagem que já saiu do documento.

       O relógio fica em `window.__quadrosRelogio`, e não só nesta closure:
       na execução este script mora no <main> e é recriado quando "Concluir
       série" troca o <main> sem recarregar — medido em 20/09/2026, cada
       série deixava mais um relógio vivo alternando uma foto que já tinha
       saído do documento (26 ao fim de um treino). A troca limpa o relógio
       antes de tirar os nós, e o script novo limpa o que encontrar. */
    var relogio = null;
    function alternar(foto) {
      if (relogio) { clearInterval(relogio); relogio = null; }
      if (window.__quadrosRelogio) { clearInterval(window.__quadrosRelogio); window.__quadrosRelogio = null; }
      if (!foto) return;
      var urls = (foto.dataset.quadros || "").split("|").filter(Boolean);
      if (urls.length > 1) {
        var pre = new Image(); pre.src = urls[1];
        var i = 0;
        relogio = setInterval(function () {
          i = (i + 1) % urls.length;
          foto.src = urls[i];
        }, 900);
        window.__quadrosRelogio = relogio;
      }
    }
    alternar(document.querySelector("[data-quadros]"));

    /* O POSTER: o player nasce no toque e morre no "fechar".
     *
     * Iframe montado no toque, e não no HTML — iframe escondido
     * continua tocando e trazendo anúncio. A escada de mídia é do servidor
     * (`data-tipo`); aqui só se cria o elemento que ela mandou. */
    var demo = document.querySelector("[data-demo]");
    var abrir = demo && demo.querySelector("[data-demo-abrir]");
    if (demo && abrir) {
      var posterHtml = null;
      var montar;
      var fechar = function () {
        demo.classList.remove("demo--aberta");
        demo.innerHTML = posterHtml;
        posterHtml = null;
        var novo = demo.querySelector("[data-demo-abrir]");
        if (novo) { novo.addEventListener("click", montar); novo.focus(); }
        alternar(demo.querySelector("[data-quadros]"));
      };
      montar = function () {
        if (demo.querySelector("iframe, video")) return;
        posterHtml = demo.innerHTML;
        if (relogio) { clearInterval(relogio); relogio = null; }
        var tipo = demo.dataset.tipo;
        var elemento;
        if (tipo === "youtube") {
          elemento = document.createElement("iframe");
          elemento.allow = "autoplay; encrypted-media; picture-in-picture";
          elemento.allowFullscreen = true;
          elemento.title = "Execução de " + (demo.dataset.nome || "");
        } else if (tipo === "video") {
          elemento = document.createElement("video");
          elemento.autoplay = true; elemento.loop = true;
          elemento.muted = true; elemento.playsInline = true;
        } else {
          elemento = document.createElement("img");
          elemento.alt = "Execução de " + (demo.dataset.nome || "");
        }
        elemento.src = demo.dataset.src;
        var botao = document.createElement("button");
        botao.type = "button";
        botao.className = "demo__fechar";
        botao.textContent = "fechar";
        botao.addEventListener("click", fechar);
        demo.innerHTML = "";
        demo.classList.add("demo--aberta");
        demo.appendChild(elemento);
        demo.appendChild(botao);
        botao.focus();
        /* E A DEMONSTRAÇÃO SOBE PARA A FAIXA LIVRE (24/09/2026).
         *
         * O `max-height` do CSS garante que o vídeo CABE entre o cabeçalho e
         * o bloco preso; ele não garante que a pessoa está OLHANDO para lá.
         * Na execução o toque no poster costuma vir com a página rolada na
         * série, e o vídeo abria acima da dobra.
         *
         * QUEM SOBE É A CABEÇA DO EXERCÍCIO, e não a demonstração. Medido:
         * rolando o `.demo` para `start`, ele parava em 68px — logo abaixo do
         * cabeçalho, como se queria — e levava o NOME para -9px, atrás da
         * barra. Um vídeo sem o nome do exercício por cima é um vídeo de que
         * exercício? A cabeça (`.agora__topo`) é o irmão anterior da
         * demonstração, então subir ela põe nome, músculos e vídeo na faixa
         * livre de uma vez; o `max-height` do CSS desconta `--exec-cabeca`
         * para o vídeo continuar cabendo depois dela. A rota de LEITURA do
         * exercício divide este script e não tem `.agora__topo` — lá o alvo
         * continua sendo a própria demonstração.
         *
         * Os dois têm `scroll-margin-top` com `--appbar-h` e
         * `--exec-descanso`, então `start` basta. Vem DEPOIS do `focus()` de
         * propósito: o foco também rola, do jeito que o navegador escolher, e
         * quem manda no resultado é a última rolagem. Quem pediu menos
         * movimento não recebe animação. */
        var suave = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var alvo = document.querySelector(".agora__topo") || demo;
        alvo.scrollIntoView({ block: "start", behavior: suave ? "smooth" : "auto" });
      };
      abrir.addEventListener("click", montar);
    }

  })();
</script>
