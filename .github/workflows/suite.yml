# A SUÍTE COMPLETA: tudo, inclusive os `lento`, DEPOIS do merge e à mão.
# Não é mais o gate de PR — quem barra o merge é "suíte rápida"
# (`suite-rapida.yml`), que roda as mesmas fatias sem os testes `lento`.
#
# Fatiada como a rápida (`ci/shard.py`, cada job serial), pelo mesmo motivo:
# `--parallel` do Django morre com `cannot pickle 'traceback'` quando um
# teste que assume ordem de PK cai (medido no PR #33, Linux). Aqui roda TUDO
# (sem `--exclude-tag`):
#
#   * DEPOIS do merge (`push: main`): prova inteiro o commit que entrou em
#     produção. Se um `lento` quebrar, foi este merge — reverta ou conserte;
#     o GitHub manda e-mail ao dono por run vermelho no branch padrão;
#   * à mão (`workflow_dispatch`).
#
# A NOITE NÃO É DESTE FLUXO. A suíte roda com a DATA CONGELADA (quarta
# 16/09/2026, `config/relogio.py`) — aqui, na rápida e no pre-push —, então
# um cron aqui mediria a mesma quarta de sempre e não pegaria quebra de
# calendário nenhuma. Quem vê o dia é `noturna.yml`: a suíte completa toda
# madrugada com `NUTRIPLAN_DATA_REAL=1` e uma issue de alerta que abre ao
# cair e fecha ao passar. Este fluxo NÃO liga o relógio real, de propósito
# (`config/test_relogio.py`, "o gate continua congelado").
#
# TRANSIÇÃO (sai num PR seguinte): enquanto sessões antigas ainda esperam o
# check "suíte completa", este fluxo roda também em `pull_request`/
# `merge_group`, para não deixar nenhum `enfileirar` do helper velho órfão.
#
# Sem segredo: Postgres 16 (produção), SECRET_KEY fictícia, `contents: read`.
name: Suíte completa

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: completa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fatia:
    name: "fatia ${{ matrix.i }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        i: [0, 1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: nutriplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://nutriplan:nutriplan@localhost:5432/nutriplan
      DJANGO_SECRET_KEY: "ci-somente-nao-e-segredo-0123456789abcdefghijklmnopqrstuvwxyz"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      GOOGLE_CLIENT_ID: "ci-somente.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-somente-nao-e-segredo"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: "fatia ${{ matrix.i }} de 5 (serial, TUDO)"
        shell: bash
        run: |
          set -o pipefail
          echo "vCPUs do runner: $(nproc)"
          LABELS=$(python ci/shard.py ${{ matrix.i }} 5)
          echo "módulos desta fatia:"; echo "$LABELS" | tr ' ' '\n'
          python manage.py test $LABELS --durations 15 \
            --verbosity=1 --noinput 2>&1 | tee suite-${{ matrix.i }}.log

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.i }}-${{ github.sha }}
          path: suite-${{ matrix.i }}.log
          retention-days: 14

  gate:
    name: "suíte completa"
    needs: [fatia]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "verde só se todas as fatias passaram"
        run: |
          echo "resultado das fatias: ${{ needs.fatia.result }}"
          [ "${{ needs.fatia.result }}" = "success" ]
