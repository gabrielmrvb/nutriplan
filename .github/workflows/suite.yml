# A SUÍTE COMPLETA: tudo, inclusive os testes `lento`, DEPOIS do merge e à
# noite. Não é mais o gate de PR — quem barra o merge é "suíte rápida"
# (`suite-rapida.yml`), que roda o mesmo comando sem `--exclude-tag lento`.
#
# Por que separar (18/09/2026): a suíte inteira serial levava ~31 min de
# execução, e com a fila local cada PR esperava ~32 min de runner. O
# repositório é PRIVADO, então minuto de Actions é metered (~2000/mês no
# free): PR de 32 min é espera E custo. O gate virou a suíte rápida em
# paralelo; os testes pesados (estatística/estresse sobre um ano semeado —
# `@tag("lento")`) saem do caminho de todo PR e rodam aqui:
#
#   * DEPOIS do merge (`push: [main]`): o commit que entrou em produção é
#     provado inteiro. Se um `lento` quebrar, foi este merge — reverta ou
#     conserte, e o GitHub manda e-mail ao dono por run vermelho no branch
#     padrão (é o alerta, sem segredo de webhook);
#   * à NOITE (`schedule`, 06:00 UTC = 03:00 BRT): pega quebra que dependa
#     de calendário/relógio antes do primeiro PR do dia;
#   * à mão (`workflow_dispatch`).
#
# TRANSIÇÃO (sai num PR seguinte): enquanto sessões antigas ainda esperam o
# check "suíte completa", este fluxo continua rodando em `pull_request` e
# `merge_group` — assim nenhum `enfileirar` do helper velho fica órfão. O PR
# que tira esses dois gatilhos é o que enfim deixa o completo só no
# pós-merge e à noite.
#
# Sem segredo: Postgres 16 de serviço (a maior de produção, Neon),
# SECRET_KEY fictícia (50 caracteres de `accounts.E005`), `contents: read`.
# `pipefail` porque `test | tee` devolveria o status do `tee`.
name: Suíte completa

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # TRANSIÇÃO (ver cabeçalho): sai quando as sessões antigas migrarem para o
  # check "suíte rápida".
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: "suíte completa"
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: nutriplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://nutriplan:nutriplan@localhost:5432/nutriplan
      DJANGO_SECRET_KEY: "ci-somente-nao-e-segredo-0123456789abcdefghijklmnopqrstuvwxyz"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      GOOGLE_CLIENT_ID: "ci-somente.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-somente-nao-e-segredo"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: "suíte completa (paralela, tudo)"
        shell: bash
        run: |
          set -o pipefail
          echo "vCPUs do runner: $(nproc)"
          python manage.py test --parallel auto --verbosity=1 --noinput 2>&1 | tee suite.log

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log-${{ github.sha }}
          path: suite.log
          retention-days: 14
