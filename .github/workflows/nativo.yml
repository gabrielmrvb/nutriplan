# A CASCA NATIVA (Capacitor, `nativo/`), construída e PROVADA nas duas
# plataformas — porque esta máquina é Windows e o iOS só constrói em macOS
# (22/09/2026).
#
#   android: Gradle no ubuntu (JDK 21), APK de debug como artefato, e um
#            emulador (API 34, KVM) onde `nativo/scripts/prova_android.sh`
#            abre o app, lê o WebView pelo DevTools remoto (o service worker
#            controla a página), liga o modo avião e confere que a tela é o
#            shell offline do PWA servido pelo worker — não a erro.html.
#   ios:     xcodebuild no macOS, sem assinatura (sem a conta Apple é o que
#            existe), instalado e aberto num iPhone do simulador; capturas
#            online, offline (pf bloqueia 80/443 no runner) e em tema escuro.
#
# Não é gate de PR — roda quando `nativo/` muda e pelo botão. Nenhuma conta
# nasce: só GET anônimo em produção (landing) e o shell offline.
name: Casca nativa

on:
  push:
    branches: [main]
    paths: ["nativo/**", ".github/workflows/nativo.yml"]
  pull_request:
    paths: ["nativo/**", ".github/workflows/nativo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: "Android: APK + emulador (online, offline, escuro)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nativo/package-lock.json

      - name: Dependências e sync
        working-directory: nativo
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Gradle (debug)
        working-directory: nativo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: nativo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: websocket-client (DevTools do WebView)
        run: pip install websocket-client

      - name: Prova no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash nativo/scripts/prova_android.sh nativo/android/app/build/outputs/apk/debug/app-debug.apk capturas-android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-android
          path: capturas-android/
          if-no-files-found: warn

  ios:
    name: "iOS: xcodebuild + simulador (online, offline, escuro)"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nativo/package-lock.json

      - name: Dependências e sync
        working-directory: nativo
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: Xcode
        run: |
          sudo xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Prova no simulador
        run: bash nativo/scripts/prova_ios.sh capturas-ios

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ios
          path: capturas-ios/
          if-no-files-found: warn
