# O GATE DE MERGE: a suíte SEM os testes `lento`, em paralelo, em < 10 min.
#
# Até 18/09/2026 o único check obrigatório era "suíte completa" — a suíte
# inteira, serial, ~31 min de execução (medido nos últimos 10 runs: instalar
# ~10 s com cache, o resto é o `manage.py test`). Com a fila local
# empilhando PRs, cada um esperando ~32 min de runner, o gargalo era o
# tempo do check. E o repositório é PRIVADO: minuto de Actions é metered
# (~2000/mês no free), então PR de 32 min também é custo, não só espera.
#
# Este fluxo é o gate rápido: `--parallel auto` (um processo por vCPU do
# runner; o `RunnerUnico` já conta os clones `test_nutriplan_N`) e
# `--exclude-tag lento` (os testes pesados de estatística/estresse, que
# `suite.yml` roda depois do merge e à noite — ver lá o que é `lento` e por
# quê). O nome do job é o check que `scripts/github.py` (CHECK) espera antes
# de mergear; renomear um sem o outro deixa todo PR esperando um check que
# nunca vem (há teste em `config/test_ci.py`).
#
# Sem segredo: Postgres de serviço, SECRET_KEY fictícia com os 50 caracteres
# de `accounts.E005`, `permissions: contents: read`. Postgres 16 = a maior
# de produção (Neon). `pipefail` porque `test | tee` devolveria o status do
# `tee` — verde com a suíte vermelha.
name: Suíte rápida

on:
  pull_request:
    branches: [main]
  # A fila do GitHub, para o dia em que o repositório morar numa organização
  # (hoje é privado e a API recusa merge_group/branch protection); inócuo até lá.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: rapida-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: "suíte rápida"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriplan
          POSTGRES_PASSWORD: nutriplan
          POSTGRES_DB: nutriplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://nutriplan:nutriplan@localhost:5432/nutriplan
      DJANGO_SECRET_KEY: "ci-somente-nao-e-segredo-0123456789abcdefghijklmnopqrstuvwxyz"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      GOOGLE_CLIENT_ID: "ci-somente.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-somente-nao-e-segredo"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: "suíte rápida (paralela, sem os lentos)"
        shell: bash
        run: |
          set -o pipefail
          echo "vCPUs do runner: $(nproc)"
          python manage.py test --parallel auto --exclude-tag lento \
            --verbosity=1 --noinput 2>&1 | tee suite-rapida.log

      - name: Guardar o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-rapida-log-${{ github.sha }}
          path: suite-rapida.log
          retention-days: 14
