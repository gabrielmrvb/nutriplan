# Backup do banco de produção, criptografado, guardado como artefato.
#
# ------------------------------------------------------------------ ATIVAÇÃO
# Este fluxo roda TODO DIA (decisão do dono, 27/09/2026) — "DESLIGADO no
# relógio de propósito" descrevia a versão anterior, só com o botão manual, e
# deixou de ser verdade. O que sustenta rodar sozinho, todo dia:
#
#   * o segredo é `BACKUP_DATABASE_URL`, o mesmo papel SOMENTE LEITURA
#     (`nutriplan_leitor`, sem CREATE) que `restaurar-mensal.yml` já usa —
#     nenhum segredo novo de banco entrou no repositório para isto;
#   * o repositório é PÚBLICO: um artefato de Actions de repositório público é
#     baixável por qualquer conta do GitHub. É por isso
#     que o dump nunca sobe em claro — ver a criptografia abaixo.
#
# ------------------------------------------------- o que isto custa em risco
# Quem tiver permissão de escrita em workflow neste repositório consegue abrir
# um PR que imprima o segredo e ler o banco (leitura, não escrita — o papel
# não tem CREATE nem DELETE). O que reduz o risco, e já está feito aqui:
#
#   * o dump NUNCA existe em claro como artefato — ele é criptografado com
#     AES-256 antes de sair do runner, e a senha (`BACKUP_PASSPHRASE`) é um
#     segundo segredo, guardado FORA do GitHub. Quem baixar o artefato sem
#     ela tem um arquivo inútil;
#   * `permissions: contents: read` — o token do fluxo não escreve nada;
#   * sem `pull_request_target`, então fork nenhum executa isto;
#   * retenção curta: cópia de dado de saúde não fica parada por 90 dias.
#
# ------------------------------------------------------------------ segredos
#   BACKUP_DATABASE_URL   string de conexão do papel só-leitura nutriplan_leitor
#   BACKUP_PASSPHRASE     senha longa e aleatória, guardada FORA do GitHub —
#                         sem ela o run falha ANTES de despejar o banco (veja
#                         o passo "Conferir a senha do backup"). Cria-se com:
#                         .venv/Scripts/python.exe scripts/github.py segredo BACKUP_PASSPHRASE <arquivo>
#
# Sem a segunda, o backup não presta: ela é o que separa "artefato" de
# "banco de dados de saúde exposto".
name: Backup do banco

on:
  workflow_dispatch:
  schedule:
    # Backup diário às 06:00 UTC (03:00 em Brasília).
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  despejar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Falha ANTES de tocar no banco: sem senha, despejar já seria
      # trabalho jogado fora — o dump nasceria e não teria como virar um
      # artefato seguro. `secrets.*` não entra num `if:` de passo, então a
      # checagem é feita em shell, com o segredo mapeado para env.
      - name: Conferir a senha do backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || {
            echo "ERRO: o segredo BACKUP_PASSPHRASE está vazio. Crie com:"
            echo "  .venv/Scripts/python.exe scripts/github.py segredo BACKUP_PASSPHRASE <arquivo>"
            exit 1
          }

      # O cliente PRECISA ser >= servidor. O runner traz um pg_dump mais velho,
      # e o mais velho se recusa a despejar um servidor mais novo — produzindo
      # um arquivo vazio se ninguém checar o código de saída.
      - name: Instalar o cliente PostgreSQL 18
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' \
            /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      # Reaproveita o script versionado, que já valida código de saída,
      # tamanho e legibilidade — em vez de uma segunda cópia da lógica que
      # envelheceria em separado.
      # Fora do checkout, e nao em `saida/` dentro dele: o dump em claro nao
      # deve existir nem por um instante numa pasta sob controle de versao. O
      # `backup.sh` recusa esse destino por conta propria — aqui o destino ja
      # nasce certo, entao a recusa nunca precisa ser contornada.
      - name: Despejar e validar
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          bash scripts/backup.sh "$RUNNER_TEMP/saida"

      # `scripts/guardar.sh` e nao gpg inline, por dois motivos. O primeiro e
      # nao ter duas copias da mesma logica envelhecendo em separado. O segundo
      # e o que a versao inline NAO fazia: ele decifra de volta e compara a
      # impressao digital antes de apagar o arquivo em claro. Sem isso, um
      # artefato indecifravel sobe verde e so se revela inutil no dia em que
      # alguem precisa dele.
      - name: Criptografar e provar que decifra
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for f in "$RUNNER_TEMP"/saida/*.dump; do
            bash scripts/guardar.sh "$f"
          done
          ls -la "$RUNNER_TEMP/saida/"

      # O SHA256SUMS sobe junto: sem ele, quem baixar o artefato meses depois
      # nao tem como saber se o arquivo chegou inteiro.
      - uses: actions/upload-artifact@v4
        with:
          name: nutriplan-backup
          path: |
            ${{ runner.temp }}/saida/*.gpg
            ${{ runner.temp }}/saida/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
