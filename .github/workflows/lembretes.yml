# Os lembretes de refeição, sem nada pago.
#
# O app não tem agendador próprio, e cron no Render é serviço pago (mínimo
# US$ 1/mês, e a conta sem cartão devolve 402 — decisão do dono em 16/09/2026:
# nada pago). Este fluxo é o relógio: de 5 em 5 minutos ele bate em
# `POST /tarefas/lembretes/` com um token, e o app faz o resto
# (`push/tarefas.py` → `send_meal_reminders`). Rodar duas vezes no mesmo
# minuto é seguro — quem decide se alguém já foi avisado é a constraint do
# banco, não este relógio.
#
# O RELÓGIO DO ACTIONS ATRASA. Em hora cheia, 5 a 15 minutos de atraso são
# comuns; a janela do lembrete (15 min, `push.services`) é maior que a
# cadência por isso, e o aviso cai de 5 a 20 minutos antes da refeição.
#
# MANTER ACORDADO. O plano gratuito do Render dorme após 15 minutos sem
# tráfego e demora 37–60 s para acordar (medido na avaliação de 16/09). O
# primeiro passo bate em `/saude/vivo/` — que NÃO consulta o banco, de
# propósito: `/saude/` acordaria o Neon a cada 5 minutos e a cota gratuita
# de 100 CU-h acabaria no meio do mês (CLAUDE.md, "Monitor externo"). Se o
# serviço estiver acordando, o passo não falha: o cold start é o que ele
# existe para evitar, não um erro. Pedido a cada 5 min é superconjunto do
# "a cada 10" pedido: o cold start só volta se DOIS pedidos seguidos falharem.
#
# SEGREDO. `NUTRIPLAN_TAREFAS_TOKEN` mora nos segredos deste repositório e
# na variável do Render; nunca no repositório. `curl` não imprime cabeçalho,
# e o Actions mascara o valor de qualquer jeito. `permissions: contents:
# read` — o token do fluxo não escreve nada.
name: Lembretes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Uma rodada de cada vez; a seguinte espera, não cancela — cancelar uma
# rodada que já disparou o POST não desfaz nada.
concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  lembretes:
    name: "acordar + lembretes"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "manter acordado (/saude/vivo/, sem banco)"
        run: |
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            https://nutriplan-xxfn.onrender.com/saude/vivo/ || echo "000")
          echo "vivo: http $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::warning::/saude/vivo/ respondeu $codigo — o serviço pode estar acordando; não é falha deste passo"
          fi

      - name: "disparar lembretes (/tarefas/lembretes/)"
        env:
          TOKEN: ${{ secrets.NUTRIPLAN_TAREFAS_TOKEN }}
        run: |
          set -o pipefail
          codigo="000"
          for tentativa in 1 2 3; do
            codigo=$(curl -sS -o resposta.json -w "%{http_code}" --max-time 60 \
              -X POST -H "Authorization: Bearer $TOKEN" \
              https://nutriplan-xxfn.onrender.com/tarefas/lembretes/ || echo "000")
            if [ "$codigo" = "200" ]; then break; fi
            echo "tentativa $tentativa: http $codigo"
            sleep 20
          done
          echo "lembretes: http $codigo"
          cat resposta.json 2>/dev/null; echo
          [ "$codigo" = "200" ]
