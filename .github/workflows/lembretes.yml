# Os lembretes de refeição e o "manter acordado", sem nada pago.
#
# O app não tem agendador próprio, e cron no Render é serviço pago (mínimo
# US$ 1/mês; a conta sem cartão devolve 402 — decisão do dono em 16/09/2026:
# nada pago). Este fluxo é o relógio: a cada 5 minutos bate em
# `GET /saude/vivo/` (o serviço não dorme) e em `POST /tarefas/lembretes/`
# com um token (o app dispara o que venceu — `push/tarefas.py`). Rodar duas
# vezes no mesmo minuto é seguro: quem decide se alguém já foi avisado é a
# constraint do banco, não este relógio.
#
# O `schedule` DO GITHUB NÃO É O RELÓGIO — é só o gatilho de reserva. MEDIDO
# em 17/09/2026: o cron `*/5` rodou UMA vez em oito horas (a primeira 7h55
# depois de o fluxo entrar em `main`; nos 70 minutos seguintes, nenhuma), o
# serviço dormiu e `/saude/` levou 38 s depois de 30 min sem tráfego. A
# documentação avisa que o `schedule` atrasa em hora cheia; na prática ele
# pula. Quem marca os 5 minutos é o LAÇO dentro da rodada: o job dura quase
# o teto de 6 h de um job hospedado e, ao acabar, dispara a próxima rodada
# por `workflow_dispatch` com o `GITHUB_TOKEN` — a exceção documentada à
# regra "evento criado pelo token não cria rodada nova". Se a corrente
# quebrar (rodada cancelada, runner indisponível), o `schedule` a religa na
# próxima vez que o GitHub resolver rodá-lo. `concurrency` garante uma
# rodada de cada vez, sem cancelar a que está no ar.
#
# MANTER ACORDADO bate em `/saude/vivo/`, que NÃO consulta o banco, de
# propósito: `/saude/` acordaria o Neon a cada 5 minutos e a cota gratuita
# de 100 CU-h acabaria no meio do mês (CLAUDE.md, "Monitor externo"). Se o
# serviço estiver acordando, o passo não falha: o cold start é o que ele
# existe para evitar, não um erro.
#
# SEGREDO. `NUTRIPLAN_TAREFAS_TOKEN` mora nos segredos deste repositório e
# na variável do Render; nunca no repositório. `curl` não imprime cabeçalho
# e o Actions mascara o valor de qualquer jeito. `actions: write` existe só
# para o `dispatches` do fim; `contents: read`.
name: Lembretes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Uma rodada de cada vez; a seguinte espera, não cancela — cancelar a rodada
# que está no laço é abrir um buraco de até 6 h no relógio.
concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  relogio:
    name: "relógio: acordar + lembretes de 5 em 5 min"
    runs-on: ubuntu-latest
    # 5h50 de laço + folga; o teto de um job hospedado é 6 h.
    timeout-minutes: 355

    steps:
      - name: "laço de 5 em 5 min (≈ 5h45)"
        env:
          TOKEN: ${{ secrets.NUTRIPLAN_TAREFAS_TOKEN }}
        run: |
          set -o pipefail
          fim=$(( SECONDS + 5*3600 + 45*60 ))
          rodada=0; falhas_seguidas=0
          while [ "$SECONDS" -lt "$fim" ]; do
            rodada=$((rodada + 1))
            vivo=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              https://nutriplan-xxfn.onrender.com/saude/vivo/ || echo "000")
            codigo=$(curl -sS -o resposta.json -w "%{http_code}" --max-time 60 \
              -X POST -H "Authorization: Bearer $TOKEN" \
              https://nutriplan-xxfn.onrender.com/tarefas/lembretes/ || echo "000")
            echo "$(date -u +%H:%M:%SZ) rodada $rodada · vivo: http $vivo · lembretes: http $codigo · $(cat resposta.json 2>/dev/null | head -c 300)"
            if [ "$codigo" = "200" ]; then
              falhas_seguidas=0
            else
              falhas_seguidas=$((falhas_seguidas + 1))
              echo "::warning::lembretes respondeu $codigo ($falhas_seguidas seguidas)"
              # Três seguidas é o app fora do ar ou o token errado: falha a
              # rodada para aparecer em vermelho, e a próxima recomeça.
              if [ "$falhas_seguidas" -ge 3 ]; then exit 1; fi
            fi
            sleep 300
          done

      - name: "próxima rodada (a corrente não depende do schedule)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/lembretes.yml/dispatches \
            -d '{"ref":"main"}')
          echo "dispatch da próxima rodada: http $codigo"
