# Os lembretes de refeição — só disparar, sem nada pago.
#
# O app não tem agendador próprio, e cron no Render é serviço pago (mínimo
# US$ 1/mês; a conta sem cartão devolve 402 — decisão do dono em 16/09/2026:
# nada pago). Este fluxo é o relógio dos lembretes: a cada disparo do
# `schedule` bate UMA vez em `POST /tarefas/lembretes/` com um token (o app
# dispara o que venceu — `push/tarefas.py`). Rodar duas vezes no mesmo
# minuto é seguro: quem decide se alguém já foi avisado é a constraint do
# banco, não este relógio.
#
# MANTER ACORDADO NÃO É DESTE FLUXO. Antes (17/09/2026, manhã) o job era um
# LAÇO de ~5h45 que também batia em `/saude/vivo/` de 5 em 5 min e se
# re-disparava com o `GITHUB_TOKEN` — só para segurar o cold start que o
# `schedule` instável deixava passar. Desde 17/09 (tarde) quem mantém o
# serviço acordado é o UptimeRobot (monitor externo gratuito em
# `/saude/vivo/`, a cada 5 min, confiável). Sem o cold start para segurar, a
# corrente perdeu a razão e saiu: nada de laço, nada de `workflow_dispatch`
# automático, nada de `actions: write`. Uma rodada curta por disparo.
# Ver CLAUDE.md, "O que existe no Render".
#
# O `schedule` DO GITHUB ATRASA E ÀS VEZES PULA. MEDIDO em 17/09/2026: o
# cron `*/5` rodou UMA vez em oito horas. O preço, aceito pelo dono, é
# lembrete atrasado — não mais cold start. Se a pontualidade do lembrete
# passar a importar, a saída registrada é o cron do Render (pago) ou um
# segundo disparador externo; ver CLAUDE.md.
#
# SEGREDO. `NUTRIPLAN_TAREFAS_TOKEN` mora nos segredos deste repositório e
# na variável do Render; nunca no repositório. `curl` não imprime cabeçalho
# e o Actions mascara o valor de qualquer jeito. Só `contents: read`.
name: Lembretes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lembretes:
    name: "disparar lembretes vencidos"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "POST /tarefas/lembretes/"
        env:
          TOKEN: ${{ secrets.NUTRIPLAN_TAREFAS_TOKEN }}
        run: |
          set -o pipefail
          # --max-time 90 tolera o Neon acordando (o web fica de pé pelo
          # UptimeRobot; o POST é o que acorda o banco, quando é hora).
          codigo=$(curl -sS -o resposta.json -w "%{http_code}" --max-time 90 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            https://nutriplan-xxfn.onrender.com/tarefas/lembretes/ || echo "000")
          echo "lembretes: http $codigo · $(cat resposta.json 2>/dev/null | head -c 300)"
          # A rodada falha (vermelho) se não veio 200 — token errado ou app
          # fora do ar. A próxima rodada do schedule recomeça do zero.
          [ "$codigo" = "200" ]
